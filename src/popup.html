<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Downloader for Circle</title>
    <style id="serp-auth-boot-css">
      #activationSection,
      .popup-shell > .header,
      .popup-shell > #trialBanner,
      .popup-shell > #mainContent,
      .popup-shell > #status,
      .popup-shell > .status {
        display: none !important;
      }
      body[data-popup-state="auth"] #activationSection[data-serp-auth-ui="1"] { display: block !important; }
      body[data-popup-state="auth"] .popup-shell > .header { display: flex !important; }
      body[data-popup-state="ready"] .popup-shell > .header { display: flex !important; }
      body[data-popup-state="ready"] .popup-shell > #mainContent:not(.hidden) { display: grid !important; }
      body[data-popup-state="ready"] .popup-shell > #status:not(.hidden),
      body[data-popup-state="ready"] .popup-shell > .status:not(.hidden) { display: block !important; }
      body[data-popup-state="ready"] .popup-shell > #trialBanner:not(.hidden) { display: flex !important; }
      body[data-popup-state="auth"] .popup-shell > #bootSplash,
      body[data-popup-state="ready"] .popup-shell > #bootSplash {
        display: none !important;
      }
    </style>
    <script src="site-config.js"></script>
    <link rel="stylesheet" href="styles/popup-enhanced.css" />
  </head>
  <body>
    <div class="bg-orbit bg-orbit-a"></div>
    <div class="bg-orbit bg-orbit-b"></div>

    <div class="popup-shell">
      <div id="bootSplash" class="boot-splash">Loading Circle Downloader...</div>

      <header class="header">
        <div>
          <p class="kicker">SERP Labs</p>
          <h1>Circle Downloader</h1>
          <p class="subtitle">Capture visible videos, images, files, and post text from the current Circle page.</p>
        </div>
        <button id="refreshBtn" class="ghost-btn" type="button">Rescan</button>
      </header>

      <div id="trialBanner" class="trial-banner hidden"></div>

      <section id="activationSection" class="activation-section"></section>

      <main id="mainContent" class="main-content hidden">
        <section class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">Videos</span>
            <strong id="videoCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Images</span>
            <strong id="imageCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Text</span>
            <strong id="textCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Assets</span>
            <strong id="assetCount">0</strong>
          </div>
        </section>

        <section class="tabs">
          <button class="tab-btn active" data-tab="videos" type="button">Videos</button>
          <button class="tab-btn" data-tab="images" type="button">Images</button>
          <button class="tab-btn" data-tab="texts" type="button">Text</button>
          <button class="tab-btn" data-tab="assets" type="button">Assets</button>
        </section>

        <section class="panel-actions">
          <button id="downloadAllBtn" class="primary-btn" type="button">Download Videos</button>
        </section>

        <section id="assetList" class="asset-list"></section>
      </main>

      <footer id="status" class="status info">Checking activation status...</footer>
    </div>

    <script src="logger.js"></script>
    <script type="module" src="auth.js"></script>
    <script defer src="popup-enhanced.js"></script>
    <script defer src="auth-ui.js"></script>
    <script defer src="trial-banner.js"></script>
    <script defer src="update-notifier.js"></script>
  </body>
</html>
